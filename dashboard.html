<!DOCTYPE html>
<html>
<head>
    <title>IoT Dashboard</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            text-align: center;
        }

        h1 {
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            color: black;
            padding: 20px;
            margin: 15px;
            border-radius: 15px;
            width: 200px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .value {
            font-size: 28px;
            font-weight: bold;
        }

        .alert {
            color: yellow;
            font-size: 20px;
            margin-top: 10px;
        }

        table {
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
            color: black;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 10px 20px;
            border: 1px solid #ddd;
        }

        th {
            background: #2575fc;
            color: white;
        }
    </style>
</head>

<body>

<h1>🌐 Real-Time IoT Monitoring Dashboard</h1>

<div class="container">

    <div class="card">
        <h3>🌡 Temperature</h3>
        <div class="value">{{ temp }} °C</div>
    </div>

    <div class="card">
        <h3>💧 Humidity</h3>
        <div class="value">{{ hum }} %</div>
    </div>

    <div class="card">
        <h3>⚡ Energy</h3>
        <div class="value">{{ energy }}</div>
    </div>

</div>

<div class="alert">{{ alert }}</div>

<h2>📊 Recent Sensor Data</h2>

<table>
<tr>
    <th>ID</th>
    <th>Temperature</th>
    <th>Humidity</th>
    <th>Energy</th>
</tr>

{% for row in data %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }} °C</td>
    <td>{{ row[2] }} %</td>
    <td>{{ row[3] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
